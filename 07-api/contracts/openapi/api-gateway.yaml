openapi: 3.0.3
info:
  title: Woman Alert — Entry Points
  version: 1.0.0
  description: |
    Woman Alert has **no API Gateway in production**. The earlier gateway and the old monolith were
    removed from the repository on 25/10/2026. Each client (mobile and web) chooses the service by
    the start of the path and sends the request directly to it:

    | Paths | Service |
    |-------|---------|
    | `/api/evidences` | Evidence |
    | `/api/alerts`, `/api/contacts`, `/api/location-logs`, `/api/zones`, `/api/resources`, `/api/saved-routes`, `/api/frequent-locations`, `/api/received-alerts`, `/api/zone-reports`, `/api/resource-calls`, `/api/safe-trips`, `/api/auto-protection`, `/api/public/**` | Alert |
    | Everything else (`/api/auth`, `/api/users`, `/api/devices`, `/api/admin`, `/api/settings`) | Auth |

    The routing lives in `services/serviceRoutes.ts` (mobile) and `core/api/service-routes.ts` plus
    an interceptor (web). Whether to add a gateway is an open decision (DIS-ARQ-04).

    ## Authentication
    Most endpoints require a valid JWT issued by the Auth service:
    ```
    Authorization: Bearer <token>
    ```
    Every service validates the token with the same key, without calling Auth.

    ## Internal headers (only between services)
    - `X-Internal-Key`: required by `/internal/rpc/{Contract}/{method}` and `/internal/events`.
    - `X-Protection-Key`: device key used by `/api/public/auto-protection/**`.

servers:
  - url: http://localhost:8081
    description: Auth — local (Docker Compose)
  - url: http://localhost:8082
    description: Alert — local
  - url: http://localhost:8083
    description: Evidence — local
  - url: https://alerta-mujer-auth.onrender.com
    description: Auth — production
  - url: https://alerta-mujer-alert.onrender.com
    description: Alert — production
  - url: https://alerta-mujer-evidence.onrender.com
    description: Evidence — production

tags:
  - name: Health
    description: Status of each service

paths:
  /actuator/health:
    get:
      summary: Health check of a service
      description: |
        Public in each of the three services. Render uses it, and UptimeRobot calls the three
        endpoints every 5 minutes to keep the free-plan services awake. A sleeping service can take
        up to about 90 seconds to answer the first request.
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP, DOWN]
              example:
                status: UP
        '503':
          description: The service is starting or a dependency is down
          content:
            application/json:
              schema:
                $ref: './auth-service.yaml#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
