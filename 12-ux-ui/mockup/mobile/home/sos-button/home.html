<script data-purpose="interaction-handlers">
    document.addEventListener('DOMContentLoaded', () => {
      const sosBtn = document.getElementById('sos-trigger-btn');
      let pressTimer;

      // Handle SOS Press Feedback
      if (sosBtn) {
        sosBtn.addEventListener('mousedown', () => {
          pressTimer = window.setTimeout(() => {
            alert('🚨 ¡ALERTA SOS ACTIVADA!\nSe está notificando a tus contactos de emergencia y autoridades locales.');
          }, 3000);
        });

        sosBtn.addEventListener('mouseup', () => {
          clearTimeout(pressTimer);
        });

        sosBtn.addEventListener('touchstart', () => {
          pressTimer = window.setTimeout(() => {
            alert('🚨 ¡ALERTA SOS ACTIVADA!\nSe está notificando a tus contactos de emergencia y autoridades locales.');
          }, 3000);
        });

        sosBtn.addEventListener('touchend', () => {
          clearTimeout(pressTimer);
        });
      }

      // Simple Bottom Nav Switching feedback
      const navButtons = document.querySelectorAll('nav button[data-tab]');
      navButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          navButtons.forEach(b => {
            b.classList.remove('opacity-100');
            b.classList.add('opacity-75');
            const dot = b.querySelector('.bg-amber-300');
            if (dot) {
              dot.classList.remove('bg-amber-300');
              dot.classList.add('opacity-0');
            }
          });

          btn.classList.remove('opacity-75');
          btn.classList.add('opacity-100');
          const activeDot = btn.querySelector('span:last-child');
          if (activeDot) {
            activeDot.classList.remove('opacity-0');
            activeDot.classList.add('bg-amber-300');
          }
        });
      });
    });
  </script>
